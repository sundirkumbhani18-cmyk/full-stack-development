<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        class Demo {


            msg() {
                console.log("hello");
            }

            sum() {
                let a = 10, b = 5;
                console.log(`sum = ${a + b}`);

            }


            squareArray(arr){
                let ans = []
                arr.map((v)=>{
                    ans.push(v*v);
                })
                return ans;
                
            }

        }


        const a = new Demo();
        a.msg();
        a.sum();
        let ans = a.squareArray([1,2,3,4,5]);
        console.log(ans);
        



    </script>
</body>

</html>
