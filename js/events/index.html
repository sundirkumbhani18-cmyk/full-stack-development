<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aquamarine;
            width: 100px;
            height: 100px;
        }
        .box-2{
            background-color: blueviolet;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
     <button onclick="show()">click</button>
     <button ondblclick="msg()">db click</button>
     <button onmouseup="mup()">release</button>
     <button onmousedown="mdown()">press</button>
     <hr>
     <br>
     <div class="box" onmouseover="mo()"></div><br>
     <div class="box-2" onmouseout="mout()"></div><br>
     <div class="box-2" onmousemove="mmove()"></div>

    <script>
         const show=()=>{
            alert(`clicked`);
            console.log(`clicked`);
            
         }
         const msg=()=>{
            alert(`db clicked`);
         }
         const mo=()=>{
            alert(`mouse entered`);
         }
         const mout=()=>{
            alert(`mouse left`);
         }
         const mmove=()=>{
            alert(`mouse moving`);
         }
         const mup=()=>{
            alert(`mouse relesed`);
         }
         const mdown=()=>{
            alert(`mouse preesed`)
         }
    </script>
</body>
</html>
