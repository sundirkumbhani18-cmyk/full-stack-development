        let x = parseInt(prompt("enter x:-"));
        let y = parseInt(prompt("enter y:-"));
        let ch = parseInt(prompt("select your choice prees 1 for sum,press 2 for minus,prees 3 for multiple prees 4 for div"));
        switch (ch) {
            case 1:
                document.write(`<h1>sum:-${x + y}</h1>`);

            case 2:
                document.write(`<h1>minus:-${x - y}</h1>`);
                break;
            case 3:
                document.write(`<h1>mul:-${x * y}</h1>`);

            case 4:
